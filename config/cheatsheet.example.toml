# Cheatsheet Configuration Example
# This file demonstrates the available fields for cheat sheet entries
# This file also contains examples of invocation of the cheatsheet app itself

[[entry]]
title = "list"
command = "cheatsheet list"
description = "List all available cheat sheet entries"

[[entry]]
title = "search"
command = "cheatsheet search <keyword>"
description = "Search for a specific cheat sheet entry"

[[entry]]
title = "add"
command = "cheatsheet add -t <title> -c <command> [-d <description>]"
description = "Add a new cheat sheet entry"

[[entry]]
title = "remove"
command = "cheatsheet remove <title>"
description = "Remove a cheat sheet entry by title"
