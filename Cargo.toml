[package]
name = "cheatsheet"
version = "0.1.0"
edition = "2021"
authors = ["Aleksandr Ganiukhin <aganyukhin@outlook.com>"]
description = "A simple CLI to manage personal command cheat sheets."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fuzzy-matcher = "0.3"
spdlog-rs = "0.5.1"
anyhow = "1.0.100"
strum_macros = "0.27.2"
mockall = { version = "0.13.1" }
indexmap = "2.12.0"

[dev-dependencies]
